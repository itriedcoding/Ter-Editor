[package]
name = "ter-fs"
version = "0.2.0"
edition = "2021"
description = "Native filesystem, indexing and search core for Ter Editor"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
walkdir = "2.5"
rayon = "1.10"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
