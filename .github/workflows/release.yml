name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (leave empty to use package.json)'
        required: false
      publish:
        description: 'Publish the installers to a GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --win --x64
          - name: macOS arm64
            os: macos-latest
            args: --mac --arm64
          - name: macOS x64
            os: macos-15-intel
            args: --mac --x64
          - name: Linux x64
            os: ubuntu-latest
            args: --linux --x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build node-pty from source (macOS pty helper)
        if: runner.os == 'macOS'
        run: |
          # The shipped Darwin prebuilds contain a spawn-helper macOS refuses to
          # execute, so drop them and compile the module (and helper) locally.
          rm -rf node_modules/node-pty/prebuilds
          npm rebuild node-pty --build-from-source

      - name: Build Rust filesystem core
        run: npm run build:native

      - name: Typecheck
        run: npm run typecheck

      - name: Smoke test native filesystem, pty and language modules
        shell: bash
        run: |
          set +e
          npm run smoke 2>&1 | tee smoke.log
          status=${PIPESTATUS[0]}
          {
            echo "### Smoke output ($(uname -s) $(uname -m))"
            echo '```'
            tail -c 5000 smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Preserve smoke log on failure
        if: failure()
        shell: bash
        run: |
          test -f smoke.log || exit 0
          git config user.name "Ter CI"
          git config user.email "ci@ter-editor.dev"
          mkdir -p ci-logs
          cp smoke.log "ci-logs/smoke-${RUNNER_OS}-${RUNNER_ARCH}.log"
          git add -f ci-logs
          git commit -m "ci: smoke log ${RUNNER_OS}-${RUNNER_ARCH}" || exit 0
          git push origin "HEAD:ci-logs-${RUNNER_OS}-${RUNNER_ARCH}" || true

      - name: Set version from dispatch input
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build renderer and main process
        run: npm run build

      - name: Rebuild node-pty for the Electron ABI
        run: npx electron-rebuild -f -w node-pty

      - name: Package installers
        shell: bash
        run: |
          publish=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then publish="--publish always"; fi
          sign=""
          if [[ "${{ matrix.args }}" == *"--mac"* ]] && [ -n "${APPLE_ID}" ]; then
            sign="-c.mac.notarize=true -c.mac.hardenedRuntime=true"
          fi
          npx electron-builder ${{ matrix.args }} $publish $sign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ter-editor-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
          if-no-files-found: warn
          retention-days: 14
