name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (leave empty to use package.json)'
        required: false
      publish:
        description: 'Publish the installers to a GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --win --x64
          - name: macOS arm64
            os: macos-latest
            args: --mac --arm64
          - name: macOS x64
            os: macos-15-intel
            args: --mac --x64
          - name: Linux x64
            os: ubuntu-latest
            args: --linux --x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Rust filesystem core
        run: npm run build:native

      - name: Typecheck
        run: npm run typecheck

      - name: Smoke test native filesystem, pty and language modules
        run: npm run smoke

      - name: Set version from dispatch input
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build renderer and main process
        run: npm run build

      - name: Rebuild node-pty for the Electron ABI
        run: npx electron-rebuild -f -w node-pty

      - name: Package installers
        run: npx electron-builder ${{ matrix.args }} ${{ (github.event_name == 'push' || inputs.publish) && '--publish always' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ter-editor-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
          if-no-files-found: warn
          retention-days: 14
